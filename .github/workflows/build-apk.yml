name: Build APK (dual-mode chat)

on:
  push:
    branches: [feat/chat-dual-mode-html]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Patch LocalTools.kt (chat_ui + app_control groups)
        run: python3 scripts/patch_chat_ui_tools.py

      - name: Patch RikkaHubApp.kt (skin store init)
        run: python3 scripts/patch_skin_store_init.py

      - name: Patch ChatPage.kt (embed html layer)
        run: python3 scripts/patch_chat_page_html.py

      # release is already signed with the debug signingConfig inside
      # app/build.gradle.kts, so no keystore step is required.
      - name: Build release APK (R8)
        id: build
        continue-on-error: true
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleRelease --no-daemon --stacktrace > build.log 2>&1
          echo "gradle_exit=$?" >> "$GITHUB_OUTPUT"
          tail -n 40 build.log

      # CI logs need auth to download; check-run annotations do not. Turning compiler
      # errors into ::error annotations makes them readable through the public
      # check-runs REST API, which is how this branch gets its build diagnostics.
      - name: Report build errors as annotations
        if: steps.build.outputs.gradle_exit != '0'
        run: python3 scripts/report_build_errors.py build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Fail when the build failed
        if: steps.build.outputs.gradle_exit != '0'
        run: exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-dual-mode-chat
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
