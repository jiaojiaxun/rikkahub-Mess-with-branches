name: Build APK (app-control v2, R8)

# Fixes over the v2 workflow:
#   1. checkout with submodules: recursive  -> material3/material-color-utilities and
#      llama-cpp/native/llama.cpp are git submodules and are NEVER part of a GitHub
#      branch archive, so without this the build dies in :llama-cpp:configureCMake.
#   2. bun + pnpm                            -> :web:installWebUiDeps runs
#      `bun install --frozen-lockfile` and :web:buildWebUi runs `pnpm run build` on
#      Linux; :web:preBuild dependsOn buildWebUi, so every :app task waits on it.
#   3. compile and package as separate steps, each piping into
#      scripts/report_build_errors.py, so a failure is readable from the public
#      check-run annotations API instead of the auth-only log download.
#   4. publish the APK as a release asset     -> workflow artifacts need an
#      authenticated API call to download, release assets are plain public URLs.
on:
  push:
    branches:
      - feat/app-control-v2-r8
      - feat/app-control-v2
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: assembleRelease (R8, arm64, lzx signing)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout source with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The :web module shells out to bun (install) and pnpm (build) on Linux.
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup pnpm
        run: npm install -g pnpm@latest

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Inject AppControl gateway into LocalTools.kt
        run: python3 scripts/patch_app_control.py

      - name: Restore signing keystore
        id: kscache
        uses: actions/cache@v4
        with:
          path: lzx.kshsia
          key: rikkahub-lzx-kshsia-v1

      - name: Generate keystore if missing
        if: steps.kscache.outputs.cache-hit != 'true'
        run: |
          if [ ! -f lzx.kshsia ]; then
            keytool -genkeypair -v \
              -keystore lzx.kshsia \
              -alias lzx -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass lzx123456 -keypass lzx123456 \
              -dname "CN=lzx, OU=Dev, O=RikkaHub, L=City, ST=State, C=CN"
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compile Kotlin (release)
        run: |
          set -o pipefail
          ./gradlew :app:compileReleaseKotlin --no-daemon --stacktrace 2>&1 | tee compile.log

      - name: Report Kotlin compile errors
        if: always()
        run: python3 scripts/report_build_errors.py compile.log

      - name: Build release APK (R8, no obfuscation, independent signing)
        env:
          RIKKAHUB_KEYSTORE_PATH: ${{ github.workspace }}/lzx.kshsia
          RIKKAHUB_KEYSTORE_PASSWORD: lzx123456
          RIKKAHUB_KEY_ALIAS: lzx
          RIKKAHUB_KEY_PASSWORD: lzx123456
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report packaging errors
        if: always()
        run: python3 scripts/report_build_errors.py build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-app-control-v2-r8
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: lzx-keystore
          path: lzx.kshsia

      - name: Publish APK as release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "r8-${{ github.run_number }}" \
            --target "${{ github.sha }}" \
            --title "RikkaHub app-control-v2 R8 build (run ${{ github.run_number }})" \
            --notes "arm64 release APK. R8 minify + resource shrinking enabled, obfuscation disabled (-dontobfuscate). Signed with the independent lzx.kshsia keystore. Commit ${{ github.sha }}." \
            --prerelease \
            app/build/outputs/apk/release/*.apk
