name: Build APK (dual-mode chat)

on:
  push:
    branches: [feat/chat-dual-mode-html, 'port/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Two git submodules (material3/material-color-utilities, llama-cpp/native/llama.cpp)
      # are not fetched by default; without them every build fails inside Gradle.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # :web needs bun (installWebUiDeps) and pnpm (buildWebUi on Linux).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install pnpm (used by :web:buildWebUi on Linux)
        run: npm install -g pnpm

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Patch LocalTools.kt (chat_ui + app_control groups)
        run: python3 scripts/patch_chat_ui_tools.py

      - name: Patch AssistantLocalToolPage.kt (settings switches)
        run: python3 scripts/patch_local_tool_page.py

      - name: Patch RikkaHubApp.kt (skin store init)
        run: python3 scripts/patch_skin_store_init.py

      - name: Patch ChatPage.kt (embed html layer)
        run: python3 scripts/patch_chat_page_html.py

      # --continue: keep compiling independent modules after the first failure so one
      # run surfaces every module's Kotlin errors as annotations.
      - name: Compile Kotlin (release)
        id: compile
        continue-on-error: true
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:compileReleaseKotlin --continue --no-daemon --stacktrace > compile.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 20 compile.log
          exit $code

      - name: Report Kotlin compile errors
        if: steps.compile.outcome == 'failure'
        run: python3 scripts/report_build_errors.py compile.log

      - name: Build release APK (R8)
        id: build
        if: steps.compile.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          ./gradlew :app:assembleRelease --no-daemon --stacktrace > build.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 20 build.log
          exit $code

      - name: Report packaging / lint errors
        if: steps.build.outcome == 'failure'
        run: python3 scripts/report_build_errors.py build.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            compile.log
            build.log
          if-no-files-found: ignore

      - name: Fail when a build step failed
        if: steps.compile.outcome == 'failure' || steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-dual-mode-chat
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
