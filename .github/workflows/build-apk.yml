name: Build APK (dual-mode chat)

on:
  push:
    branches: [feat/chat-dual-mode-html]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The repo has two git submodules (material3/material-color-utilities and
      # llama-cpp/native/llama.cpp). checkout does NOT fetch them by default, which
      # left those directories empty and made every previous CI run fail inside Gradle
      # with no Kotlin error at all. recursive keeps nested submodules working too.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # :web:installWebUiDeps shells out to `bun` to install the web-ui package deps.
      # The runner image has no bun, which is what killed the build right after the
      # submodule fix (task ':web:installWebUiDeps' FAILED / Cannot run program "bun").
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Patch LocalTools.kt (chat_ui + app_control groups)
        run: python3 scripts/patch_chat_ui_tools.py

      - name: Patch RikkaHubApp.kt (skin store init)
        run: python3 scripts/patch_skin_store_init.py

      - name: Patch ChatPage.kt (embed html layer)
        run: python3 scripts/patch_chat_page_html.py

      # Split compile from packaging so a failure's stage is unambiguous.
      # release is already debug-signed inside app/build.gradle.kts (no keystore step).
      - name: Compile Kotlin (release)
        id: compile
        continue-on-error: true
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:compileReleaseKotlin --no-daemon --stacktrace > compile.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          tail -n 20 compile.log

      - name: Report Kotlin compile errors
        if: steps.compile.outcome == 'failure'
        run: python3 scripts/report_build_errors.py compile.log

      - name: Build release APK (R8)
        id: build
        if: steps.compile.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          ./gradlew :app:assembleRelease --no-daemon --stacktrace > build.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          tail -n 20 build.log

      - name: Report packaging / lint errors
        if: steps.build.outcome == 'failure'
        run: python3 scripts/report_build_errors.py build.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            compile.log
            build.log
          if-no-files-found: ignore

      - name: Fail when a build step failed
        if: steps.compile.outcome == 'failure' || steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-dual-mode-chat
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
