name: Context Estimation CI

on:
  workflow_dispatch:
  push:
    branches:
      - feat/context-estimation-liquid-glass

permissions:
  contents: read

concurrency:
  group: context-estimation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify context estimation and compile debug
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew \
            :ai:testDebugUnitTest \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: context-estimation-reports-${{ github.run_number }}
          path: |
            ai/build/reports/tests/**
            app/build/reports/tests/**
            app/build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: context-estimation-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
